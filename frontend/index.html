<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedEvidence · 循证研究工作台</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="search.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#question"><span aria-hidden="true">M</span> MedEvidence</a>
    <nav aria-label="工作台导航"><a href="#question">检索</a><a href="#literature">文献</a><a href="#review">综述</a></nav>
    <a class="source" href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener noreferrer">PubMed ↗</a>
  </div>
</header>
<main>
  <section class="hero" id="question" aria-labelledby="main-title">
    <div class="intro">
      <p class="eyebrow">MEDICAL LITERATURE WORKSPACE</p>
      <h1 id="main-title">循证研究工作台</h1>
      <p>从医学研究问题出发，查找 PubMed 文献、筛选来源并生成有引文的证据综述。</p>
    </div>
    <form id="search">
      <label for="query">医学研究问题</label>
      <textarea id="query" required maxlength="1000" rows="2" placeholder="例如，二甲双胍对 2 型糖尿病患者的效果？"></textarea>
      <details id="english-options">
        <summary>补充英文检索式</summary>
        <label class="visually-hidden" for="english">英文检索式</label>
        <input id="english" maxlength="1000" placeholder="metformin AND type 2 diabetes">
      </details>
      <div class="search-actions">
        <label class="toggle"><input type="checkbox" id="semantic" disabled> AI 语义排序</label>
        <span id="model-state">正在检查 AI 配置…</span>
        <button type="submit" id="search-button">检索 PubMed</button>
      </div>
    </form>
  </section>
  <div class="workspace">
    <section class="literature" id="literature" aria-labelledby="results-title">
      <header class="section-head">
        <h2 id="results-title">文献结果</h2>
        <p id="status" role="status">输入研究问题开始检索。</p>
      </header>
      <details id="expression" hidden><summary>查看 PubMed 检索式</summary><p></p></details>
      <div class="filters" id="filters" hidden>
        <label>结果内搜索<input id="filter" type="search" placeholder="标题、作者、期刊、PMID"></label>
        <label>排序<select id="sort"><option value="rank">相关性</option><option value="bm25">BM25</option><option value="year">发表年份 · 新到旧</option></select></label>
        <label class="toggle"><input type="checkbox" id="abstract-only">有摘要</label>
      </div>
      <p id="ranking-notice" class="notice" hidden></p>
      <div id="results"></div>
    </section>
    <aside id="review" aria-labelledby="review-title">
      <header class="section-head"><h2 id="review-title">证据综述</h2><p id="selection-count">已选 0 / 8 篇</p></header>
      <div id="selected"></div>
      <p class="note">综述使用 PubMed 摘要。请核对原文、研究设计与局限。</p>
      <button type="button" id="review-button" disabled>生成证据综述</button>
      <p id="review-status" role="status"></p>
      <div id="review-result"></div>
    </aside>
  </div>
</main>
<footer>数据来源为 NCBI PubMed。 <a href="https://www.ncbi.nlm.nih.gov/home/about/policies/">NCBI 使用政策与摘要版权 ↗</a></footer>
</body>
</html>
