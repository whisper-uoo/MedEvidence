<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedEvidence · 循证研究工作台</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="search.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#question"><span aria-hidden="true">M</span><strong>MedEvidence</strong></a>
    <nav class="nav-list" aria-label="工作台导航">
      <a href="#question" aria-current="location">研究检索</a>
      <a href="#literature">文献浏览</a>
      <a href="#review">证据综述</a>
    </nav>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <a href="#question">循证研究工作台</a>
      <a class="source" href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener noreferrer">PubMed ↗</a>
    </header>
<main>
  <section class="hero" id="question" aria-labelledby="main-title">
    <div class="intro">
      <h1 id="main-title">研究检索</h1>
      <p>检索真实医学文献，筛选研究并生成带引文的证据综述。</p>
    </div>
    <form id="search">
      <label for="query">医学研究问题</label>
      <textarea id="query" required maxlength="1000" rows="2" placeholder="例如，二甲双胍对 2 型糖尿病患者的效果？"></textarea>
      <div class="examples"><span>试试</span>
        <button type="button" class="secondary example">睡眠不足是否影响大学生记忆能力</button>
        <button type="button" class="secondary example">二甲双胍对 2 型糖尿病患者的效果？</button>
      </div>
      <details id="english-options">
        <summary>补充英文检索式</summary>
        <label class="visually-hidden" for="english">英文检索式</label>
        <input id="english" maxlength="1000" placeholder="metformin AND type 2 diabetes">
      </details>
      <div class="search-actions">
        <span id="model-state">正在检查 AI 配置…</span>
        <button type="submit" id="search-button">检索 PubMed</button>
      </div>
    </form>
  </section>
  <div class="workspace">
    <section class="search-facets" aria-labelledby="facet-title">
      <h2 id="facet-title">检索条件</h2>
      <div class="year-range">
        <label>起始年份<input form="search" id="from-year" type="number" min="1500" placeholder="不限"></label>
        <label>截止年份<input form="search" id="to-year" type="number" min="1500" placeholder="不限"></label>
      </div>
      <label>文献类型<select form="search" id="publication-type">
        <option value="">全部类型</option><option value="rct">随机对照试验</option>
        <option value="systematic">系统评价</option><option value="meta">Meta 分析</option>
        <option value="review">综述</option><option value="clinical">临床试验</option>
      </select></label>
      <label>每页篇数<select form="search" id="page-size"><option>10</option><option>20</option><option>30</option><option>50</option></select></label>
      <button type="submit" form="search" class="secondary" id="apply-filters">应用条件</button>
    </section>
    <section class="literature" id="literature" aria-labelledby="results-title">
      <header class="section-head">
        <h2 id="results-title">文献结果</h2>
        <p id="status" role="status">输入研究问题开始检索。</p>
      </header>
      <details id="expression" hidden><summary>查看 PubMed 检索式</summary><p></p><button type="button" class="secondary" id="edit-expression">编辑英文检索式</button></details>
      <div class="filters" id="filters" hidden>
        <label>结果内搜索<input id="filter" type="search" placeholder="标题、作者、期刊、PMID"></label>
        <label>排序<select id="sort"><option value="bm25">本页 BM25</option><option value="pubmed">PubMed 最佳匹配</option><option value="year">本页发表日期</option><option value="ai" disabled>本页 AI 相关性</option></select></label>
        <label class="toggle"><input type="checkbox" id="abstract-only">有摘要</label>
        <button type="button" class="secondary" id="rerank" disabled>AI 重排序</button>
      </div>
      <p id="ranking-notice" class="notice" hidden></p>
      <div id="results"></div>
      <div class="pagination" id="pagination" hidden>
        <button type="button" class="secondary" id="prev">上一页</button>
        <span id="page-label" aria-live="polite"></span>
        <button type="button" class="secondary" id="next">下一页</button>
      </div>
    </section>
    <aside class="reading-tools" id="review" aria-labelledby="review-title">
      <header class="section-head"><h2 id="review-title">证据综述</h2><p id="selection-count">已选 0 / 10 篇</p></header>
      <div id="selected"></div>
      <button type="button" class="secondary" id="clear-selection" hidden>清空选择</button>
      <p class="note">AI 生成 · 基于 PubMed 摘要，用于科研信息辅助。请核对原文；不用于个体诊疗。</p>
      <button type="button" id="review-button" disabled>生成证据综述</button>
      <p id="review-status" role="status"></p>
      <button type="button" class="secondary" id="export-review" hidden>导出 Markdown</button>
      <div id="review-result"></div>
    </aside>
  </div>
</main>
<footer>数据来源为 NCBI PubMed。 <a href="https://www.ncbi.nlm.nih.gov/home/about/policies/">NCBI 使用政策与摘要版权 ↗</a></footer>
  </div>
</div>
</body>
</html>
